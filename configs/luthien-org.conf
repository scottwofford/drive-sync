# Luthien org Google Drive sync
# Shared with Jai — syncs to GitHub

REMOTE="gdrive-luthien"
LOCAL_DIR="/Users/scottwofford/build/luthien-org"
SYNC_SUBDIR="luth-gdrive-clone"
GIT_PUSH=true
CONVERT_DOCX=true
SKIP_DANGLING_SHORTCUTS=true

EXCLUDES=(
    "*.log.gz"
    "*.log"
    ".env"
    ".env.*"
    "**/.env"
    "**/.env.*"
    "_claude-code-docs/**"
    "LUTHIEN_DRIVE_README.md"
    "*.mp4"
    "*.webm"
    "*.mkv"
    "*.wav"
    "*Recording*"
    "Luthien Meet Recordings/**"
    "**/kap-ogyy-kjq*"
    "**/njo-vtad-eza*"
    "**/v1 static prototypes*"
    "_coefficient_giving/*Budget*"
    "_coefficient_giving/Budget/**"
    "_coefficient_giving/CG Archive/*udget*"
    "_mtg notes/*-Redwood/Shaheen/**"  # EU AI Office NDA material (signed NDA, Shaheen topics doc); stays in Drive, kept out of the luthien-org repo
)

REVERSE_SYNC_REMOTE="gdrive-claude-docs"
REVERSE_SYNC_INCLUDES=("*.md" "*.csv")
